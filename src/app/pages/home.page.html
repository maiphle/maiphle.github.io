<section class="home-page" aria-labelledby="home-title">
  <div class="hero-copy">
    <h1 id="home-title">
      {{ heroHeadingLine1 }}<br />
      {{ heroHeadingLine2 }}
    </h1>

    <p class="summary">{{ profile.intro }}</p>

    <div class="hero-actions" aria-label="Professional links">
      <a class="resume-button" [href]="resumeUrl" target="_blank" rel="noopener noreferrer">My Resume</a>

      <a class="icon-link" [href]="linkedInUrl" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn profile">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M6.94 8.5A1.56 1.56 0 1 1 6.94 5.4a1.56 1.56 0 0 1 0 3.1zM5.6 9.7h2.7v8.7H5.6V9.7zm4.4 0h2.6V11h.04c.36-.7 1.25-1.44 2.58-1.44 2.76 0 3.28 1.82 3.28 4.18v4.66h-2.72v-4.13c0-.98-.02-2.24-1.37-2.24-1.37 0-1.58 1.07-1.58 2.17v4.2H10V9.7z" />
        </svg>
      </a>

      <a class="icon-link" [href]="githubUrl" target="_blank" rel="noopener noreferrer" aria-label="GitHub profile">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 .5a11.5 11.5 0 0 0-3.64 22.42c.58.1.79-.25.79-.56v-2.15c-3.22.7-3.9-1.37-3.9-1.37-.53-1.35-1.3-1.7-1.3-1.7-1.06-.72.08-.7.08-.7 1.17.08 1.8 1.2 1.8 1.2 1.05 1.78 2.74 1.27 3.4.97.1-.76.4-1.27.73-1.56-2.57-.29-5.28-1.28-5.28-5.7 0-1.26.45-2.29 1.2-3.1-.12-.3-.52-1.5.11-3.13 0 0 .98-.31 3.2 1.18a11.2 11.2 0 0 1 5.82 0c2.2-1.5 3.19-1.18 3.19-1.18.64 1.63.24 2.83.12 3.13.75.82 1.2 1.84 1.2 3.1 0 4.43-2.72 5.4-5.3 5.68.42.36.8 1.08.8 2.19v3.24c0 .31.2.66.8.55A11.5 11.5 0 0 0 12 .5z" />
        </svg>
      </a>
    </div>
  </div>

  <div class="hero-image-wrap">
    <img
      class="profile-image"
      [ngSrc]="profile.imagePath"
      [alt]="profile.imageAlt"
      width="420"
      height="520"
      priority
    />
  </div>
</section>
